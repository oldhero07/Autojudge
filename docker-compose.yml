version: '3.8'

services:
  autojudge:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=autojudge-secret-key-change-in-production
    volumes:
      - ./flask_app/models:/app/flask_app/models
      - ./flask_app/logs:/app/flask_app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - autojudge
    restart: unless-stopped
    profiles:
      - production